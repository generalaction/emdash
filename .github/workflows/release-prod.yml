name: Release (Production)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or reuse draft release
        id: prepare
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/release/prepare-release.ts

  release-linux:
    needs: [prepare-release]
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: write
    with:
      channel: stable
      release_id: ${{ needs.prepare-release.outputs.release_id }}
    secrets: inherit

  release-win:
    needs: [prepare-release]
    runs-on: windows-2022
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          posthog-key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          posthog-host: ${{ secrets.POSTHOG_HOST }}
          windows-native: 'true'
      - name: Export Python path for native modules
        shell: bash
        run: echo "python=$(which python)" >> "$GITHUB_ENV"

      - name: Build app
        shell: bash
        run: pnpm run build

      - shell: bash
        run: echo "NODE_OPTIONS=${NODE_OPTIONS:-not set}" && node --version

      - name: Require Azure Trusted Signing secrets
        shell: bash
        env:
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$AZ_TENANT" ] && [ -n "$AZ_CLIENT" ] && [ -n "$AZ_SECRET" ]; then
            echo "Azure Trusted Signing is configured."
          else
            echo "::error::Azure Trusted Signing secrets are required for a public release."
            exit 1
          fi

      - name: Build Windows packages
        shell: bash
        working-directory: apps/emdash-desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/build.ts
          --platform win --arch x64
          --release-id "${{ needs.prepare-release.outputs.release_id }}"

      - name: Verify Windows code signature
        shell: bash
        working-directory: apps/emdash-desktop
        run: node --experimental-strip-types scripts/release/verify-win.ts

      - name: Upload verified Windows assets to owned draft
        shell: bash
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/upload-github-assets.ts
          --platform win --release-id "${{ needs.prepare-release.outputs.release_id }}"

  release-mac:
    needs: [prepare-release]
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          posthog-key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          posthog-host: ${{ secrets.POSTHOG_HOST }}

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - run: pnpm run build

      - run: echo "NODE_OPTIONS=${NODE_OPTIONS:-not set}" && node --version

      - name: Build signed DMGs + ZIPs
        working-directory: apps/emdash-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/build.ts
          --platform mac --arch both --targets dmg,zip
          --release-id "${{ needs.prepare-release.outputs.release_id }}"

      - name: Notarize and staple
        working-directory: apps/emdash-desktop
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node --experimental-strip-types scripts/release/notarize-mac.ts --app-bundle "Emdash.app"

      - name: Upload notarized macOS assets to owned draft
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --experimental-strip-types scripts/release/upload-github-assets.ts
          --platform mac --release-id "${{ needs.prepare-release.outputs.release_id }}"

  finalize-release:
    needs: [prepare-release, release-linux, release-win, release-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish GitHub release draft
        working-directory: apps/emdash-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >
          node --experimental-strip-types scripts/release/finalize-release.ts
          --release-id "${{ needs.prepare-release.outputs.release_id }}"
